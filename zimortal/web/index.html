<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZiMortal · 对局复盘</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e6edf4;background:#10151b;color-scheme:dark;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;background:#263646;color:#eff6fc;border:1px solid #526276;border-radius:6px;padding:8px 13px}button:hover{background:#354b60}button:disabled{opacity:.4;cursor:default}input,select{background:#111a24;border:1px solid #526276;color:#fff;border-radius:6px;padding:8px}header{padding:20px 28px;border-bottom:1px solid #334251;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:24px;margin:0 auto 0 0}h2{font-size:18px;margin:0 0 14px}.badge{border:1px solid #4a6174;border-radius:5px;padding:4px 8px;font-size:14px;color:#b6c9da}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 28px;background:#18212b;position:sticky;top:0;z-index:2}.toolbar input[type=range]{padding:0;flex:1;min-width:100px;accent-color:#43bec7}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;max-width:1600px;margin:auto;gap:20px;padding:22px 28px}.panel{background:#1a232d;border:1px solid #344454;border-radius:10px;padding:18px;margin-bottom:16px}.summary{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.event{color:#6ad8df;font-weight:600;font-size:20px}.note{line-height:1.7;color:#c2d0dc}.players{display:grid;gap:14px}.player{background:#172b30;border:1px solid #34545c;border-radius:10px;padding:18px}.player.active{border-color:#65d7dd;box-shadow:inset 4px 0 #65d7dd}.player-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.player-title h2{margin:0 auto 0 0}.label{font-size:14px;color:#afc0ce;margin:10px 0 8px}.tiles{display:flex;flex-wrap:wrap;gap:5px}.tile{display:inline-flex;justify-content:center;align-items:center;min-width:32px;height:44px;background:#f3f0e5;color:#172029;border-radius:4px;border:1px solid #d1cdbf;font-family:"Noto Serif CJK SC",serif;font-size:23px;font-weight:bold}.tile.red{color:#b72435}.tile.big{border-bottom:4px solid #bc9b43}.tile.locked{outline:2px solid #a797d6;outline-offset:-2px}.melds{display:flex;gap:14px;flex-wrap:wrap}.meld{display:flex;flex-direction:column;gap:5px}.meld span.caption{font-size:14px;color:#c4d5df}.records{font-size:14px;line-height:1.8;color:#b9cbd8}.actions{display:grid;gap:8px}.legal{background:#111b26;border-radius:5px;padding:9px;line-height:1.5;font-size:14px}.history{max-height:70vh;overflow:auto}.history button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #344454;border-radius:0;background:none;padding:11px;font-size:14px;line-height:1.5}.history button.selected{background:#294951;color:#7fe5ea}.muted{color:#9dafbf;font-size:14px}.error{color:#ffc28a;line-height:1.6}.empty{padding:60px;text-align:center;color:#aabccb}#loaderror{margin:0 28px;color:#ffb9ad}details summary{cursor:pointer;padding-bottom:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}footer{max-width:1600px;margin:auto;padding:0 28px 24px;font-size:14px;color:#9eb3c3}@media(max-width:1050px){.layout{grid-template-columns:1fr}.history{max-height:300px}}@media(max-width:600px){header,.toolbar{padding:14px}.layout{padding:14px;gap:0}.panel,.player{padding:14px}.tile{min-width:29px;height:40px;font-size:21px}.toolbar button{padding:8px}h1{width:100%;font-size:21px}footer{padding:0 14px 20px}}
</style>
</head>
<body>
<header><h1>ZiMortal <span class="muted">宁乡跑胡子 · 对局复盘</span></h1><span class="badge">全信息审查</span><label>种子 <input id="seed" type="number" value="118" min="-2147483648" max="2147483647" style="width:120px"></label><label>庄家 <select id="dealer"><option value="0">玩家一</option><option value="1">玩家二</option><option value="2">玩家三</option></select></label><button id="generate">生成对局</button></header>
<div class="toolbar"><button id="first" disabled>开局</button><button id="prev" disabled>上一步</button><button id="play" disabled>播放</button><button id="next" disabled>下一步</button><input id="scrub" type="range" min="0" max="0" value="0" aria-label="对局进度"><span id="position">0 / 0</span><button id="last" disabled>终局</button></div>
<p id="loaderror" role="alert"></p>
<div class="layout"><main><section class="panel" aria-live="polite"><div class="summary"><span id="event" class="event">正在生成对局…</span><span id="remaining" class="badge"></span><span id="phase" class="badge"></span></div><div id="note" class="note"></div><div id="result"></div></section><div id="players" class="players"></div><section class="panel" style="margin-top:16px"><h2>当前来牌与落桌牌</h2><div id="pending"></div><div class="label">落桌牌 · 按出现顺序</div><div id="river" class="tiles"></div></section><section class="panel"><h2>下一步合法动作</h2><div id="legal" class="actions"></div></section></main><aside><section class="panel"><h2>动作时间线</h2><p class="muted" id="verification"></p><div id="history" class="history"></div></section></aside></div>
<footer>展示三家暗手与坎，仅用于规则审查；玩家 Observation 不含这些对手隐藏信息。胡息栏统计已成牌组及手中坎，不代表当前一定能胡。每步“验证通过”指引擎合法动作与牌数守恒检查，规则正确性仍需人工核对。</footer>
<script>
const $=id=>document.getElementById(id);const names=['玩家一','玩家二','玩家三'];const small='一二三四五六七八九十',big='壹贰叁肆伍陆柒捌玖拾';const labels={draw:'摸牌',discard:'出牌',chi:'吃',peng:'碰',wei:'偎',stinky_wei:'臭偎',kan:'坎',pao:'跑',ti:'提',hu:'胡',pass:'过',pair:'将'};const phases={opening:'起手检查',post_meld:'进张后检查胡牌',draw:'等待摸牌',discard:'等待出牌',respond:'处理来牌',terminal:'对局结束'};let game=null,index=0,timer=null;
function tileName(t){return (t>=10?big:small)[t%10]}
function tile(t,locked=false){const e=document.createElement('span');e.className='tile'+([1,6,9].includes(t%10)?' red':'')+(t>=10?' big':'')+(locked?' locked':'');e.textContent=tileName(t);e.title=(t>=10?'大':'小')+(t%10+1)+(locked?' · 坎，不能拆':'');return e}
function text(parent,tag,value,cls=''){const e=document.createElement(tag);e.textContent=value;e.className=cls;parent.append(e);return e}
function tiles(parent,ts,kans=[]){ts.forEach(t=>parent.append(tile(t,kans.includes(t))))}
function actionText(a){if(!a)return '发牌完成';let s=names[a.player]+' · '+labels[a.kind];if(a.tile!==null)s+=' '+tileName(a.tile);if(a.chi.length)s+=' ['+a.chi.map(tileName).join('')+']';if(a.bi.length)s+=' · 下比 '+a.bi.map(p=>p.map(tileName).join('')).join(' / ');if(a.forced)s+='（强制）';return s}
function stop(){clearInterval(timer);timer=null;$('play').textContent='播放'}
function render(){if(!game)return;const f=game.frames[index];$('event').textContent=actionText(f.action);$('remaining').textContent='牌堆 '+f.remaining+' 张';$('phase').textContent=phases[f.phase];$('note').textContent=f.note;$('result').replaceChildren();if(f.error)text($('result'),'p','规则待明确：'+f.error,'error');if(f.terminal){if(f.settlement){const s=f.settlement;text($('result'),'p',names[s.winner]+'胡牌 · '+s.huxi+'胡 · '+(Object.entries(s.fan).map(([n,v])=>n+' '+v+'番').join(' + ')||'普通1番')+' · 另外两家各付 '+s.amount_each+'元');text($('result'),'div','胡牌分解','label');const winning=document.createElement('div');winning.className='melds';s.groups.forEach(g=>{const group=document.createElement('div');group.className='meld';text(group,'span',labels[g.kind],'caption');const ts=document.createElement('div');ts.className='tiles';tiles(ts,g.tiles);group.append(ts);winning.append(group)});$('result').append(winning);}else text($('result'),'p','牌堆摸完，本局无人胡牌。');}
$('players').replaceChildren();f.players.forEach((p,i)=>{const box=document.createElement('section');box.className='player'+(f.actor===i?' active':'');const head=document.createElement('div');head.className='player-title';text(head,'h2',names[i]+(i===game.dealer?' · 庄家':''));text(head,'span','成组胡息 '+p.huxi,'badge');text(head,'span','手牌 '+p.hand.length+' 张','badge');if(p.hu_disabled)text(head,'span','本局不能胡','badge');box.append(head);text(box,'div','手牌 · 紫色边框为坎','label');const hand=document.createElement('div');hand.className='tiles';tiles(hand,p.hand,p.kans);if(!p.hand.length)text(hand,'span','空手','muted');box.append(hand);text(box,'div','已形成牌组','label');const melds=document.createElement('div');melds.className='melds';p.melds.forEach(m=>{const group=document.createElement('div');group.className='meld';text(group,'span',labels[m.kind]+' · '+m.huxi+'胡','caption');const ts=document.createElement('div');ts.className='tiles';tiles(ts,m.tiles);group.append(ts);melds.append(group)});if(!p.melds.length)text(melds,'span','尚无牌组','muted');box.append(melds);text(box,'div','过碰：'+(p.passed_peng.map(tileName).join('、')||'无')+'　过张：'+(p.passed_chi.map(tileName).join('、')||'无')+'　跑／提次数：'+p.quad_count,'records');$('players').append(box)});
$('pending').replaceChildren();if(f.pending){text($('pending'),'span',names[f.pending.player]+(f.pending.source==='draw'?'摸出：':'打出：'));$('pending').append(tile(f.pending.tile));}else text($('pending'),'span','当前无待响应来牌','muted');$('river').replaceChildren();tiles($('river'),f.river);$('legal').replaceChildren();f.legal.forEach(a=>text($('legal'),'div',actionText(a),'legal'));if(!f.legal.length)text($('legal'),'span',f.error?'规则待明确，暂停对局':'对局结束，无后续动作','muted');$('scrub').value=index;$('position').textContent=index+' / '+(game.frames.length-1);$('first').disabled=$('prev').disabled=index===0;$('last').disabled=$('next').disabled=index===game.frames.length-1;$('play').disabled=game.frames.length<2;document.querySelectorAll('[data-frame]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.frame)===index));}
async function load(){stop();$('generate').disabled=true;$('loaderror').textContent='';try{const res=await fetch('/api/game?seed='+encodeURIComponent($('seed').value)+'&dealer='+$('dealer').value);const data=await res.json();if(!res.ok)throw new Error(data.error);game=data;index=0;$('scrub').max=game.frames.length-1;$('verification').textContent=game.actions+' 次动作 · 每步检查四张守恒 · 重放验证'+(game.replay_verified?'通过':'失败');$('history').replaceChildren();game.frames.forEach(f=>{const b=document.createElement('button');b.dataset.frame=f.index;b.textContent=f.index+'. '+actionText(f.action);b.onclick=()=>{stop();index=f.index;render()};$('history').append(b)});render()}catch(e){$('loaderror').textContent='无法生成对局：'+e.message}finally{$('generate').disabled=false}}
$('generate').onclick=load;$('first').onclick=()=>{stop();index=0;render()};$('last').onclick=()=>{stop();index=game.frames.length-1;render()};$('prev').onclick=()=>{stop();index=Math.max(0,index-1);render()};$('next').onclick=()=>{stop();index=Math.min(game.frames.length-1,index+1);render()};$('scrub').oninput=()=>{stop();index=Number($('scrub').value);render()};$('play').onclick=()=>{if(timer){stop();return}if(index===game.frames.length-1)index=0;$('play').textContent='暂停';timer=setInterval(()=>{index++;render();if(index===game.frames.length-1)stop()},900)};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});load();
</script>
</body></html>
