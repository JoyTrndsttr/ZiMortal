<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e6edf4;background:#10151b;color-scheme:dark;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;background:#263646;color:#eff6fc;border:1px solid #526276;border-radius:6px;padding:8px 13px}button:hover{background:#354b60}button:disabled{opacity:.4;cursor:default}input,select{background:#111a24;border:1px solid #526276;color:#fff;border-radius:6px;padding:8px}header{padding:20px 28px;border-bottom:1px solid #334251;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:24px;margin:0 auto 0 0}h2{font-size:18px;margin:0 0 14px}.badge{border:1px solid #4a6174;border-radius:5px;padding:4px 8px;font-size:14px;color:#b6c9da}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 28px;background:#18212b;position:sticky;top:0;z-index:2}.toolbar input[type=range]{padding:0;flex:1;min-width:100px;accent-color:#43bec7}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;max-width:1600px;margin:auto;gap:20px;padding:22px 28px}.panel{background:#1a232d;border:1px solid #344454;border-radius:10px;padding:18px;margin-bottom:16px}.summary{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.event{color:#6ad8df;font-weight:600;font-size:20px}.note{line-height:1.7;color:#c2d0dc}.players{display:grid;gap:14px}.player{background:#172b30;border:1px solid #34545c;border-radius:10px;padding:18px}.player.active{border-color:#65d7dd;box-shadow:inset 4px 0 #65d7dd}.player-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.player-title h2{margin:0 auto 0 0}.label{font-size:14px;color:#afc0ce;margin:10px 0 8px}.tiles{display:flex;flex-wrap:wrap;gap:5px}.tile{display:inline-flex;flex-direction:column;justify-content:space-between;align-items:center;width:34px;min-width:34px;height:92px;padding:5px 0;background:#f3f0e5;color:#172029;border-radius:4px;border:1px solid #d1cdbf;font-family:"Noto Serif CJK SC",serif;font-size:22px;line-height:1.1;font-weight:bold;position:relative}.tile-end{display:block}.tile-bottom{transform:rotate(180deg)}.hand-columns{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:4px 0 12px;min-height:100px}.hand-column{display:flex;flex-direction:column;padding-bottom:2px}.hand-column .tile+.tile{margin-top:-62px}.hand-column .tile{box-shadow:0 -2px 4px #17202940}.hand-column .tile:last-child{box-shadow:0 2px 4px #17202960}.hand-column .tile .tile-bottom{visibility:hidden}.hand-column .tile:last-child .tile-bottom{visibility:visible}.tile.red{color:#b72435}.tile.big{border-bottom:4px solid #bc9b43}.tile.locked{outline:2px solid #a797d6;outline-offset:-2px}.melds{display:flex;gap:14px;flex-wrap:wrap}.meld{display:flex;flex-direction:column;gap:5px}.meld{min-width:44px}.meld-column{align-items:center}.meld span.caption{font-size:14px;color:#c4d5df}.records{font-size:14px;line-height:1.8;color:#b9cbd8}.actions{display:grid;gap:8px}.legal{background:#111b26;border-radius:5px;padding:9px;line-height:1.5;font-size:14px}.history{max-height:70vh;overflow:auto}.history button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #344454;border-radius:0;background:none;padding:11px;font-size:14px;line-height:1.5}.history button.selected{background:#294951;color:#7fe5ea}.muted{color:#9dafbf;font-size:14px}.error{color:#ffc28a;line-height:1.6}.empty{padding:60px;text-align:center;color:#aabccb}#loaderror{margin:0 28px;color:#ffb9ad}details summary{cursor:pointer;padding-bottom:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}footer{max-width:1600px;margin:auto;padding:0 28px 24px;font-size:14px;color:#9eb3c3}@media(max-width:1050px){.layout{grid-template-columns:1fr}.history{max-height:300px}}@media(max-width:600px){header,.toolbar{padding:14px}.layout{padding:14px;gap:0}.panel,.player{padding:14px}.tile{width:30px;min-width:30px;height:84px;font-size:20px}.hand-columns{gap:9px}.hand-column .tile+.tile{margin-top:-56px}.toolbar button{padding:8px}h1{width:100%;font-size:21px}footer{padding:0 14px 20px}}

/* Three seats surround the shared deck; text remains upright for review. */
.layout{max-width:1900px;grid-template-columns:minmax(0,1fr) 300px}
.players{grid-template-columns:minmax(0,1fr) 180px minmax(0,1fr);grid-template-areas:"seat2 center seat3" "seat1 seat1 seat1";gap:16px;padding:20px;border:2px solid #547c70;border-radius:36px;background:radial-gradient(ellipse at center,#21483f,#142e2b);box-shadow:inset 0 0 0 7px #0f232240;margin-bottom:20px}
.player[data-seat="0"]{grid-area:seat1;max-width:780px;width:100%;justify-self:center}
.player[data-seat="1"]{grid-area:seat2}.player[data-seat="2"]{grid-area:seat3}
.player{background:#142a2be8;padding:16px;min-width:0;border-radius:16px}
.player-title{gap:8px}.player-title .badge{font-size:14px}.player .records{margin-top:12px}
.player:not([data-seat="0"]) .hand-columns{gap:8px}.player:not([data-seat="0"]) .hand-columns .tile{width:28px;min-width:28px;height:80px;font-size:19px}.player:not([data-seat="0"]) .hand-column .tile+.tile{margin-top:-53px}
.table-center{grid-area:center;justify-self:center;max-width:660px;width:100%;text-align:center;padding:12px 20px}
.deck-cards{display:grid;grid-template-columns:repeat(10,9px);gap:8px 0;justify-content:center;min-height:65px;padding:8px 12px;margin:8px auto;width:fit-content}
.card-back{width:27px;min-width:27px;height:58px;border:2px solid #e0d7b8;border-radius:3px;background:repeating-linear-gradient(45deg,#633d37 0 3px,#88554b 3px 5px);box-shadow:2px 3px 3px #0005}
.card-back+.card-back{margin-left:0}.center-pending{display:flex;justify-content:center;align-items:center;gap:14px;min-height:100px;flex-wrap:wrap}.center-pending .tile{box-shadow:0 0 18px #69cfc735}
.last-action{min-height:30px;line-height:1.6;color:#8de0de;font-size:14px;border-bottom:1px solid #345b57;padding-bottom:8px;margin-bottom:8px}
.discards{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:flex-start}.discard-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#b3c5d0}.discard-item .tile{width:26px;min-width:26px;height:60px;font-size:17px;padding:3px 0}.discard-item.claimed .tile{opacity:.5}.discard-item.pending .tile{outline:2px solid #6de0df}.discard-caption{max-width:72px;text-align:center;line-height:1.4}.center-river .tile{height:60px;width:26px;min-width:26px;font-size:17px}.center-river{justify-content:center;margin-top:8px}.table-center details{margin-top:10px;text-align:left}.table-center summary{font-size:14px;color:#c6d6cb}.seat-order{font-size:14px;color:#c6d6cb;margin-bottom:12px}
@media(max-width:1250px){.layout{grid-template-columns:1fr}.history{max-height:300px}}
@media(max-width:950px){.players{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"seat2 seat3" "center center" "seat1 seat1"}.table-center{max-width:500px}}
@media(max-width:800px){.players{padding:12px;gap:10px;border-radius:22px}.player{padding:12px}.players .hand-columns{gap:6px}.players .tile{width:28px;min-width:28px;height:80px;font-size:19px}.players .hand-column .tile+.tile{margin-top:-53px}.players .melds{gap:9px}}
@media(max-width:650px){.players{grid-template-columns:1fr;grid-template-areas:"seat2" "seat3" "center" "seat1"}.table-center{padding:10px}.player[data-seat="0"]{max-width:none}.players .hand-columns{gap:9px}.players .tile{width:30px;min-width:30px;height:84px;font-size:20px}.players .hand-column .tile+.tile{margin-top:-56px}.players .discard-item .tile{width:26px;min-width:26px;height:60px;font-size:17px}}
.q-table{width:100%;border-collapse:collapse;font-size:13px}.q-table td,.q-table th{padding:5px;text-align:left;border-bottom:1px solid #ccc}#cashq{overflow-x:auto}</style>

<body>
<header><h1>ZiMortal <span class="muted">宁乡跑胡子 · 对局复盘</span></h1><span class="badge">全信息审查</span><label>种子 <input id="seed" type="number" value="118" min="-2147483648" max="2147483647" style="width:120px"></label><label>庄家 <select id="dealer"><option value="0">玩家一</option><option value="1">玩家二</option><option value="2">玩家三</option></select></label><label>策略 <select id="policy"><option value="random">随机合法动作</option><option value="round1">第一轮 ResNet</option><option value="round2">第二轮 ResNet</option><option value="round3">第三轮自博弈</option><option value="scale100k">十万级数据 ResNet</option><option value="huxi_warmup">胡息监督模型</option><option value="huxi">胡息／结算收益模型</option><option value="boundary_warmup">十五胡边界校准模型</option><option value="boundary">第六轮边界／收益模型（实验）</option><option value="planning">Rollout／向听／Belief试验模型</option><option value="cashq">现金Q排序试验模型</option><option value="cashq_rmse">现金Q数值拟合对照</option></select></label><button id="generate">生成对局</button></header>
<div class="toolbar"><button id="first" disabled>开局</button><button id="prev" disabled>上一步</button><button id="play" disabled>播放</button><button id="next" disabled>下一步</button><input id="scrub" type="range" min="0" max="0" value="0" aria-label="对局进度"><span id="position">0 / 0</span><button id="last" disabled>终局</button><button id="solve" disabled>分析进张距离</button></div>
<p id="loaderror" role="alert"></p><p id="completion" role="status"></p>
<div class="layout"><main><section class="panel" aria-live="polite"><div class="summary"><span id="event" class="event">正在生成对局…</span><span id="remaining" class="badge"></span><span id="phase" class="badge"></span></div><div id="note" class="note"></div><div id="result"></div><div id="cashq"></div></section><div id="players" class="players"></div><section class="panel"><h2>下一步合法动作</h2><div id="legal" class="actions"></div></section></main><aside><section class="panel"><h2>动作时间线</h2><p class="muted" id="verification"></p><div id="history" class="history"></div></section></aside></div>
<footer>展示三家暗手与坎，仅用于规则审查；玩家 Observation 不含这些对手隐藏信息。锁定胡息统计已成牌组及坎；组合潜力包含未落地的完整手牌组合，不等于胡时得分。结构进张不足15胡仍不可胡；自摸分析不含天胡／地胡特殊番，且不推断真实牌堆概率。每步“验证通过”指引擎合法动作与牌数守恒检查，规则正确性仍需人工核对。</footer>
<script>
const $=id=>document.getElementById(id);const names=['玩家一','玩家二','玩家三'];const small='一二三四五六七八九十',big='壹贰叁肆伍陆柒捌玖拾';const labels={draw:'摸牌',discard:'出牌',chi:'吃',peng:'碰',wei:'偎',stinky_wei:'臭偎',kan:'坎',pao:'跑',ti:'提',hu:'胡',pass:'过',pair:'将'};const phases={opening:'起手检查',post_meld:'进张后检查胡牌',draw:'等待摸牌',discard:'等待出牌',respond:'处理来牌',terminal:'对局结束'};let game=null,index=0,timer=null;
function tileName(t){return (t>=10?big:small)[t%10]}
function tile(t,locked=false){const e=document.createElement('span');e.className='tile'+([1,6,9].includes(t%10)?' red':'')+(t>=10?' big':'')+(locked?' locked':'');e.dataset.tile=t;e.setAttribute('role','img');e.setAttribute('aria-label',tileName(t)+(locked?'，坎':''));for(const cls of ['tile-end tile-top','tile-end tile-bottom']){const end=document.createElement('span');end.className=cls;end.textContent=tileName(t);end.setAttribute('aria-hidden','true');e.append(end)}e.title=(t>=10?'大':'小')+(t%10+1)+(locked?' · 坎，不能拆':'');return e}
function text(parent,tag,value,cls=''){const e=document.createElement(tag);e.textContent=value;e.className=cls;parent.append(e);return e}
function tiles(parent,ts,kans=[]){ts.forEach(t=>parent.append(tile(t,kans.includes(t))))}
function actionText(a){if(!a)return '发牌完成';let s=names[a.player]+' · '+labels[a.kind];if(a.tile!==null)s+=' '+tileName(a.tile);if(a.chi.length)s+=' ['+a.chi.map(tileName).join('')+']';if(a.bi.length)s+=' · 下比 '+a.bi.map(p=>p.map(tileName).join('')).join(' / ');if(a.forced)s+='（强制）';return s}
function stop(){clearInterval(timer);timer=null;$('play').textContent='播放'}
function render(){if(!game)return;$("completion").textContent="";$("solve").disabled=game.frames[index].terminal;const f=game.frames[index];$('event').textContent=actionText(f.action);$('remaining').textContent='牌堆 '+f.remaining+' 张';$('phase').textContent=phases[f.phase];$('note').textContent=f.note;$('result').replaceChildren();$('cashq').replaceChildren();if(f.cashq_analysis){const q=f.cashq_analysis;text($('cashq'),'h3',names[q.player]+' · 动作净收益预测');text($('cashq'),'p',q.scope+'。'+(q.changed_from_parent?'收益条件满足，采用Q动作。':'收益条件未满足，沿用父策略。'),'muted');const table=document.createElement('table');table.className='q-table';const head=document.createElement('tr');['合法动作','预计净收益','模型分歧','选择'].forEach(v=>text(head,'th',v));table.append(head);for(const c of q.candidates){const row=document.createElement('tr');text(row,'td',actionText(c.action));text(row,'td',c.cash_q.toFixed(1)+'元');text(row,'td',c.model_disagreement.toFixed(1)+'元');text(row,'td',[c.parent?'父策略':'',c.selected?'采用':''].filter(Boolean).join(' / '));table.append(row)}$('cashq').append(table);}if(f.error)text($('result'),'p','规则待明确：'+f.error,'error');if(f.terminal){if(f.settlement){const s=f.settlement;text($('result'),'p',names[s.winner]+'胡牌 · '+s.huxi+'胡 · '+(Object.entries(s.fan).map(([n,v])=>n+' '+v+'番').join(' + ')||'普通1番')+' · 另外两家各付 '+s.amount_each+'元');text($('result'),'div','胡牌分解','label');const winning=document.createElement('div');winning.className='melds';s.groups.forEach(g=>{const group=document.createElement('div');group.className='meld';text(group,'span',labels[g.kind],'caption');const ts=document.createElement('div');ts.className='hand-column meld-column';tiles(ts,g.tiles);group.append(ts);winning.append(group)});$('result').append(winning);}else text($('result'),'p','牌堆摸完，本局无人胡牌。');}
$('players').replaceChildren();f.players.forEach((p,i)=>{const box=document.createElement('section');box.dataset.seat=i;box.className='player'+(f.actor===i?' active':'');const head=document.createElement('div');head.className='player-title';text(head,'h2',names[i]+(i===game.dealer?' · 庄家':''));text(head,'span','锁定胡息 '+p.huxi,'badge');text(head,'span','手牌 '+p.hand.length+' 张','badge');if(p.formed_huxi!==undefined)text(head,'span','含手牌组合潜力 '+p.formed_huxi+'胡','badge');if(f.action&&f.action.player===i)text(head,'span','本步行动','badge');if(p.hu_disabled)text(head,'span','本局不能胡','badge');box.append(head);text(box,'div','策略：'+(game.player_policies?.[i]||game.policy),'muted');if(p.analysis_note)text(box,'div',p.analysis_note,'records');if(p.draw_analysis?.length)text(box,'div','自摸结构进张：'+p.draw_analysis.map(a=>tileName(a.tile)+' '+a.huxi+'胡'+(a.huxi>=15?'（达15胡门槛）':'（不足15胡）')).join('、'),'records');text(box,'div',p.last_action?'最近：'+actionText(p.last_action):'尚未行动','last-action');text(box,'div','手牌 · '+p.columns.length+'列 · 紫色边框为坎','label');const hand=document.createElement('div');hand.className='hand-columns';p.columns.forEach(column=>{const col=document.createElement('div');col.className='hand-column';tiles(col,column,p.kans);hand.append(col)});if(!p.hand.length)text(hand,'span','空手','muted');box.append(hand);text(box,'div','已形成牌组','label');const melds=document.createElement('div');melds.className='melds';p.melds.forEach(m=>{const group=document.createElement('div');group.className='meld';text(group,'span',labels[m.kind]+' · '+m.huxi+'胡','caption');const ts=document.createElement('div');ts.className='hand-column meld-column';tiles(ts,m.display_tiles||m.tiles);if(m.claimed_tile!==null&&m.claimed_tile!==undefined){ts.lastElementChild.dataset.claimed="true";ts.lastElementChild.title="接来的牌："+tileName(m.claimed_tile)};group.append(ts);melds.append(group)});if(!p.melds.length)text(melds,'span','尚无牌组','muted');box.append(melds);text(box,'div','过碰：'+(p.passed_peng.map(tileName).join('、')||'无')+'　过张：'+(p.passed_chi.map(tileName).join('、')||'无')+'　跑／提次数：'+p.quad_count,'records');text(box,'div','出牌记录 · 含已被接走的牌','label');const discards=document.createElement('div');discards.className='discards';p.discards.forEach(d=>{const entry=document.createElement('div');entry.className='discard-item '+d.status;entry.append(tile(d.tile));text(entry,'span','#'+d.step,'muted');text(entry,'span',d.status==='claimed'?names[d.claimed_by]+labels[d.claim_kind]:d.status==='pending'?'待响应':'落桌','discard-caption');entry.title='第'+d.step+'步 '+names[i]+'打出'+tileName(d.tile);discards.append(entry)});if(!p.discards.length)text(discards,'span','尚未出牌','muted');box.append(discards);$('players').append(box)});
const center=document.createElement('section');center.className='table-center';text(center,'div','行牌次序：玩家一 → 玩家二 → 玩家三 → 玩家一','seat-order');text(center,'h2','牌堆 · 剩余 '+f.remaining+' 张');const backs=document.createElement('div');backs.className='deck-cards';backs.setAttribute('aria-label','剩余'+f.remaining+'张背面牌');for(let n=0;n<f.remaining;n++){const back=document.createElement('span');back.className='card-back';back.setAttribute('aria-hidden','true');backs.append(back)}if(!f.remaining)text(backs,'span','牌堆已空','muted');center.append(backs);const pending=document.createElement('div');pending.id='pending';pending.className='center-pending';center.append(pending);text(center,'div',f.actor===null?(f.terminal?'本局结束':'等待处理'):('现在由'+names[f.actor]+'决策'),'badge');const riverBox=document.createElement('details');text(riverBox,'summary','落桌牌 '+f.river.length+' 张 · 按出现顺序');const river=document.createElement('div');river.id='river';river.className='tiles center-river';riverBox.append(river);center.append(riverBox);$('players').append(center);
$('pending').replaceChildren();if(f.pending){text($('pending'),'span',names[f.pending.player]+(f.pending.source==='draw'?'摸出：':'打出：'));$('pending').append(tile(f.pending.tile));}else text($('pending'),'span','当前无待响应来牌','muted');$('river').replaceChildren();tiles($('river'),f.river);$('legal').replaceChildren();f.legal.forEach(a=>text($('legal'),'div',actionText(a),'legal'));if(!f.legal.length)text($('legal'),'span',f.error?'规则待明确，暂停对局':'对局结束，无后续动作','muted');$('scrub').value=index;$('position').textContent=index+' / '+(game.frames.length-1);$('first').disabled=$('prev').disabled=index===0;$('last').disabled=$('next').disabled=index===game.frames.length-1;$('play').disabled=game.frames.length<2;document.querySelectorAll('[data-frame]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.frame)===index));}
async function load(){stop();$('generate').disabled=true;$('loaderror').textContent='';try{const res=await fetch('/api/game?seed='+encodeURIComponent($('seed').value)+'&dealer='+$('dealer').value+'&policy='+$('policy').value);const data=await res.json();if(!res.ok)throw new Error(data.error);game=data;index=0;$('scrub').max=game.frames.length-1;$('verification').textContent=game.policy+' · '+game.actions+' 次动作 · 每步检查四张守恒 · 重放验证'+(game.replay_verified?'通过':'失败');$('history').replaceChildren();game.frames.forEach(f=>{const b=document.createElement('button');b.dataset.frame=f.index;b.textContent=f.index+'. '+actionText(f.action);b.onclick=()=>{stop();index=f.index;render()};$('history').append(b)});render()}catch(e){$('loaderror').textContent='无法生成对局：'+e.message}finally{$('generate').disabled=false}}
$('solve').onclick=async()=>{const current=game,frame=index;$('solve').disabled=true;$('completion').textContent='正在精确搜索…';try{const r=await fetch('/api/completion?seed='+current.seed+'&dealer='+current.dealer+'&policy='+current.policy+'&step='+frame);const a=await r.json();if(game!==current||index!==frame)return;let value=a.status==='exact'?'玩家'+(a.player+1)+'：精确乐观进张距离 '+a.distance+'（听牌=1，可胡=0；忽略对手抢牌与摸牌时间）':a.status==='unreachable'?'在该分析口径与公开牌上界下不可完成':a.message;if(a.effective?.length)value+='；有效进张：'+[...new Set(a.effective.map(e=>tileName(e.tile)+' 上界'+e.live_upper))].join('、');if(a.wins?.length)value+='；可胡：'+a.wins.map(w=>(w.tile===null?'当前':tileName(w.tile))+' '+w.huxi+'胡 '+(Object.entries(w.fan).map(([n,v])=>n+v+'番').join('+')||'普通1番')+' 各付'+w.amount_each+'元').join('、');$('completion').textContent=value}catch(e){if(game===current&&index===frame)$('completion').textContent='分析失败：'+e.message}finally{$('solve').disabled=game?.frames[index].terminal??true}};
$('generate').onclick=load;$('first').onclick=()=>{stop();index=0;render()};$('last').onclick=()=>{stop();index=game.frames.length-1;render()};$('prev').onclick=()=>{stop();index=Math.max(0,index-1);render()};$('next').onclick=()=>{stop();index=Math.min(game.frames.length-1,index+1);render()};$('scrub').oninput=()=>{stop();index=Number($('scrub').value);render()};$('play').onclick=()=>{if(timer){stop();return}if(index===game.frames.length-1)index=0;$('play').textContent='暂停';timer=setInterval(()=>{index++;render();if(index===game.frames.length-1)stop()},900)};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});const query=new URLSearchParams(location.search);for(const key of ["seed","dealer","policy"]){if(query.has(key))$(key).value=query.get(key)}load();
</script>
</body></html>
